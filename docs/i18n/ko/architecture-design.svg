  <g font-size="10.5" fill="#94A3B8" text-anchor="middle">
    <text x="292" y="733">encrypt-then-MAC 블롭 · v1 | IV | tag/MAC | ciphertext</text>
    <text x="490" y="588">ext-gmp 필요</text>
    <text x="490" y="604">키와 암호문은 16진수</text>
    <text x="688" y="622" font-size="8.6">32바이트 다이제스트</text>
    <text x="886" y="622">무작위 솔트 · 텍스트는 base64</text>
  </g>

  <!-- ═══ factory rail ═══ -->
  <rect x="24" y="196" width="164" height="298" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="38" y="222" font-size="12" font-weight="700" fill="#9A3412">EncryptionManager</text>
  <text x="38" y="237" font-size="12" font-weight="700" fill="#9A3412">팩토리</text>
  <text x="38" y="258" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#C2410C">fromMasterKey(</text>
  <text x="38" y="271" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#C2410C">  $master32, $default)</text>
  <text x="38" y="294" font-size="10.5" fill="#7C2D12">알고리즘마다 서브키를</text>
  <text x="38" y="308" font-size="10.3" fill="#7C2D12">HMAC-SHA256으로 하나씩 유도</text>
  <text x="38" y="322" font-size="10.4" fill="#7C2D12">(info 레이블은 각각 다름) 후</text>
  <text x="38" y="336" font-size="10.5" fill="#7C2D12">모든 암호화기를 한 번에</text>
  <text x="38" y="350" font-size="10.1" fill="#7C2D12">등록하고 매니저를 반환합니다.</text>
  <text x="38" y="374" font-size="10" fill="#C2410C">마스터 키는 반드시</text>
  <text x="38" y="387" font-size="9.3" fill="#C2410C">32바이트여야 하며 아니면 예외.</text>
  <text x="38" y="411" font-size="8.5" fill="#C2410C">ext-sodium이 있으면</text>
  <text x="38" y="424" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#C2410C">sodium-xchacha20</text>
  <text x="38" y="437" font-size="10" fill="#C2410C">자동으로 추가.</text>
  <text x="38" y="461" font-size="9.6" fill="#C2410C">SM2는 ext-gmp 필요.</text>
  <line x1="188" y1="343" x2="200" y2="343" stroke="#F59E0B" stroke-width="2" marker-end="url(#arwRail)"/>

