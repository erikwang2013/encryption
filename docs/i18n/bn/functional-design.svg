  <text x="435" y="411.5" font-size="11" fill="#92400E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pbkdf2-sha256</text>
  <text x="382" y="444" font-size="10.6" fill="#475569">মানুষের পাসওয়ার্ড প্রসারিত করে</text>
  <text x="382" y="458" font-size="10" fill="#475569">র্যান্ডম সল্ট ও নির্দিষ্ট ইটারেশন সংখ্যা</text>
  <text x="382" y="472" font-size="10.7" fill="#475569">(কনস্ট্রাক্টরে, ডিফল্টে ৩১০ ০০০)।</text>
  <text x="382" y="498" font-size="11" fill="#B45309">সল্ট খালি চলবে না; নয়তো এক্সেপশন।</text>
  <text x="382" y="512" font-size="8.7" fill="#475569">পাসওয়ার্ড সংরক্ষণে Argon2 অগ্রাধিকার দিন।</text>

