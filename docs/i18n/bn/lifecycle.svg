    <text x="780" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">8</text>
    <text x="804" y="353" font-size="14.5" font-weight="700" fill="#0F172A">ডিক্রিপ্ট</text>
    <line x1="774" y1="372" x2="939" y2="372" stroke="#E2E8F0"/>
    <text x="774" y="398" font-size="10" fill="#475569">প্লেইনটেক্সট ফেরত যায় কলারের কাছে;</text>
    <text x="774" y="416" font-size="11" fill="#475569">ব্যর্থ হলে বিস্তারিত কিছু</text>
    <text x="774" y="434" font-size="9" fill="#475569">ক্লায়েন্টে ফাঁস হয় না।</text>
