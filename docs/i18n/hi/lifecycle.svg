<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="lifeTitle lifeDesc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="lifeTitle">अनुरोध जीवनचक्र — erikwang2013/encryption</title>
  <desc id="lifeDesc">संरक्षित मान का जीवनचक्र: 32-बाइट मास्टर कुंजी प्रदान करें, हर एल्गोरिदम की उप-कुंजियाँ व्युत्पन्न करें, इम्पलीमेंटेशन रजिस्टर करें, यादृच्छिक IV से एन्क्रिप्ट करें, संस्करणयुक्त ब्लॉब सहेजें, फिर रिज़ॉल्व, सत्यापन और डिक्रिप्ट करें; साथ ही रोटेशन और विफलता की स्थितियाँ।</desc>

  <defs>
    <marker id="lcArw" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#0F172A">अनुरोध जीवनचक्र</text>
  <text x="40" y="72" font-size="12.9" fill="#64748B">मास्टर कुंजी से प्लेनटेक्स्ट तक और वापस — बूटस्ट्रैप, एन्क्रिप्शन राइट पाथ, डिक्रिप्शन रीड पाथ, रोटेशन और विफलता की स्थितियाँ</text>

  <text x="40" y="104" font-size="11" fill="#94A3B8" letter-spacing="1">लिखने का पथ</text>
  <text x="40" y="308" font-size="11" fill="#94A3B8" letter-spacing="1">पढ़ने का पथ</text>

  <!-- ═══ write path ═══ -->
  <g>
    <rect x="40" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="66" cy="144" r="15" fill="#EEF2FF"/>
    <text x="66" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">1</text>
    <text x="90" y="149" font-size="14.5" font-weight="700" fill="#0F172A">प्रदान</text>
    <line x1="60" y1="168" x2="225" y2="168" stroke="#E2E8F0"/>
    <text x="60" y="194" font-size="10.6" fill="#475569">env या KMS से 32-बाइट कुंजी,</text>
    <text x="60" y="212" font-size="9.4" fill="#475569">कच्चा पासवर्ड कभी नहीं।</text>
    <text x="60" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">base64_decode($envKey)</text>
  </g>
  <line x1="245" y1="185" x2="272" y2="185" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="278" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="304" cy="144" r="15" fill="#EEF2FF"/>
    <text x="304" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">2</text>
    <text x="328" y="149" font-size="14.5" font-weight="700" fill="#0F172A">उत्पन्न</text>
    <line x1="298" y1="168" x2="463" y2="168" stroke="#E2E8F0"/>
    <text x="298" y="194" font-size="10.8" fill="#475569">हर एल्गोरिदम एक उपकुंजी,</text>
    <text x="298" y="212" font-size="8.9" fill="#475569">कुंजी दोबारा उपयोग नहीं होती।</text>
    <text x="298" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dgn:derive:aes-gcm</text>
  </g>
  <line x1="483" y1="185" x2="510" y2="185" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="516" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="542" cy="144" r="15" fill="#EEF2FF"/>
    <text x="542" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">3</text>
    <text x="566" y="149" font-size="14.5" font-weight="700" fill="#0F172A">रजिस्टर</text>
    <line x1="536" y1="168" x2="701" y2="168" stroke="#E2E8F0"/>
    <text x="536" y="194" font-size="11" fill="#475569">इम्पलीमेंटेशन उसके अपने</text>
    <text x="536" y="212" font-size="11" fill="#475569">getIdentifier() के तहत।</text>
    <text x="536" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$registry-&gt;register($cipher)</text>
  </g>
  <line x1="721" y1="185" x2="748" y2="185" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="754" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="780" cy="144" r="15" fill="#EEF2FF"/>
    <text x="780" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">4</text>
    <text x="804" y="149" font-size="14.5" font-weight="700" fill="#0F172A">कूटलेखन</text>
    <line x1="774" y1="168" x2="939" y2="168" stroke="#E2E8F0"/>
    <text x="774" y="194" font-size="10.2" fill="#475569">हर कॉल यादृच्छिक IV / nonce,</text>
    <text x="774" y="212" font-size="10.9" fill="#475569">AEAD tag या encrypt-then-MAC।</text>
    <text x="774" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$manager-&gt;encrypt($data)</text>
  </g>

  <!-- wrap to read path -->
  <path d="M856 258 V278 H142 V310" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>

  <!-- ═══ read path ═══ -->
  <g>
    <rect x="40" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="66" cy="348" r="15" fill="#EEF2FF"/>
    <text x="66" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">5</text>
    <text x="90" y="353" font-size="14.5" font-weight="700" fill="#0F172A">सहेजें</text>
    <line x1="60" y1="372" x2="225" y2="372" stroke="#E2E8F0"/>
    <text x="60" y="398" font-size="11" fill="#475569">BLOB कॉलम में बाइनरी ब्लॉब,</text>
    <text x="60" y="416" font-size="9.4" fill="#475569">या टेक्स्ट भंडारण हेतु base64।</text>
    <text x="60" y="440" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">v1 | IV | tag | ciphertext</text>
  </g>
  <line x1="245" y1="389" x2="272" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="278" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="304" cy="348" r="15" fill="#EEF2FF"/>
    <text x="304" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">6</text>
    <text x="328" y="353" font-size="14.5" font-weight="700" fill="#0F172A">रिज़ॉल्व</text>
    <line x1="298" y1="372" x2="463" y2="372" stroke="#E2E8F0"/>
    <text x="298" y="398" font-size="11" fill="#475569">रिकॉर्ड के साथ सहेजा गया</text>
    <text x="298" y="416" font-size="10.3" fill="#475569">पहचानकर्ता इम्पलीमेंटेशन चुनता है,</text>
    <text x="298" y="434" font-size="8.5" fill="#475569">ताकि पुराना डेटा डिक्रिप्ट होता रहे।</text>
  </g>
  <line x1="483" y1="389" x2="510" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="516" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="542" cy="348" r="15" fill="#EEF2FF"/>
    <text x="542" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">7</text>
    <text x="566" y="353" font-size="14.5" font-weight="700" fill="#0F172A">सत्यापन</text>
    <line x1="536" y1="372" x2="701" y2="372" stroke="#E2E8F0"/>
    <text x="536" y="398" font-size="11" fill="#475569">उपसर्ग और लंबाई की जाँच</text>
    <text x="536" y="416" font-size="11" fill="#475569">tag / MAC की तुलना से पहले</text>
    <text x="536" y="434" font-size="10.2" fill="#475569">constant time में।</text>
    <text x="536" y="452" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hash_equals()</text>
  </g>
  <line x1="721" y1="389" x2="748" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="754" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="780" cy="348" r="15" fill="#EEF2FF"/>
    <text x="780" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">8</text>
    <text x="804" y="353" font-size="14.5" font-weight="700" fill="#0F172A">कूटवाचन</text>
    <line x1="774" y1="372" x2="939" y2="372" stroke="#E2E8F0"/>
    <text x="774" y="398" font-size="10.7" fill="#475569">प्लेनटेक्स्ट कॉलर को लौट जाता है;</text>
    <text x="774" y="416" font-size="11" fill="#475569">विफलता होने पर विवरण</text>
    <text x="774" y="434" font-size="8.7" fill="#475569">क्लाइंट को नहीं दिए जाते।</text>
  </g>

  <!-- ═══ maintenance & failures ═══ -->
  <text x="40" y="492" font-size="11" fill="#94A3B8" letter-spacing="1">रखरखाव और विफलता की स्थितियाँ</text>
  <rect x="40" y="504" width="440" height="112" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="60" y="532" font-size="13.5" font-weight="700" fill="#9A3412">रोटेशन और माइग्रेशन</text>
  <circle cx="66" cy="554" r="2.5" fill="#F59E0B"/><text x="78" y="558" font-size="11" fill="#7C2D12">हर रिकॉर्ड के साथ पहचानकर्ता (और v1 उपसर्ग) रखें</text>
  <circle cx="66" cy="573" r="2.5" fill="#F59E0B"/><text x="78" y="577" font-size="9.1" fill="#7C2D12">पुरानी कुंजी से डिक्रिप्ट करें, नई से दोबारा एन्क्रिप्ट करें</text>
  <circle cx="66" cy="592" r="2.5" fill="#F59E0B"/><text x="78" y="596" font-size="9.8" fill="#7C2D12">setDefaultIdentifier() डिफ़ॉल्ट बदल देता है, कॉल साइटें अछूती रहती हैं</text>

  <rect x="520" y="504" width="440" height="112" rx="14" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="540" y="532" font-size="13.5" font-weight="700" fill="#991B1B">विफलताएँ EncryptionException उठाती हैं</text>
  <circle cx="546" cy="554" r="2.5" fill="#EF4444"/><text x="558" y="558" font-size="10" fill="#7F1D1D">अमान्य उपसर्ग, सिफ़रटेक्स्ट बहुत छोटा</text>
  <circle cx="546" cy="573" r="2.5" fill="#EF4444"/><text x="558" y="577" font-size="11" fill="#7F1D1D">tag या MAC बेमेल — छेड़छाड़ या गलत कुंजी</text>
  <circle cx="546" cy="592" r="2.5" fill="#EF4444"/><text x="558" y="596" font-size="11" fill="#7F1D1D">अज्ञात पहचानकर्ता, अपंजीकृत एल्गोरिदम, गलत कुंजी लंबाई</text>

  <text x="40" y="644" font-size="9.8" fill="#94A3B8">बूटस्ट्रैप प्रति प्रोसेस एक बार होता है (फ़ैक्टरी सभी एन्क्रिप्टर एक साथ रजिस्टर करती है); एन्क्रिप्ट और डिक्रिप्ट प्रति-अनुरोध हॉट पाथ हैं।</text>
</svg>
