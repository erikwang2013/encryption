  <!-- ═══ read path ═══ -->
  <g>
    <rect x="40" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="66" cy="348" r="15" fill="#EEF2FF"/>
    <text x="66" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">5</text>
    <text x="90" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Persistir</text>
    <line x1="60" y1="372" x2="225" y2="372" stroke="#E2E8F0"/>
    <text x="60" y="398" font-size="10.6" fill="#475569">Blob binário numa coluna BLOB,</text>
    <text x="60" y="416" font-size="9.3" fill="#475569">ou base64 para guardar em texto.</text>
    <text x="60" y="440" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">v1 | IV | tag | ciphertext</text>
  </g>
  <line x1="245" y1="389" x2="272" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="278" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="304" cy="348" r="15" fill="#EEF2FF"/>
    <text x="304" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">6</text>
    <text x="328" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Resolver</text>
    <line x1="298" y1="372" x2="463" y2="372" stroke="#E2E8F0"/>
    <text x="298" y="398" font-size="11" fill="#475569">O identificador guardado com o</text>
    <text x="298" y="416" font-size="10.6" fill="#475569">registro seleciona a implementação,</text>
    <text x="298" y="434" font-size="9.4" fill="#475569">e dados antigos seguem decifrando.</text>
  </g>
  <line x1="483" y1="389" x2="510" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="516" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="542" cy="348" r="15" fill="#EEF2FF"/>
    <text x="542" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">7</text>
    <text x="566" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Verificar</text>
    <line x1="536" y1="372" x2="701" y2="372" stroke="#E2E8F0"/>
    <text x="536" y="398" font-size="9.1" fill="#475569">Prefixo e comprimento são validados</text>
    <text x="536" y="416" font-size="10.4" fill="#475569">antes de a tag / MAC ser comparada</text>
    <text x="536" y="434" font-size="9.8" fill="#475569">em tempo constante.</text>
    <text x="536" y="452" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hash_equals()</text>
  </g>
  <line x1="721" y1="389" x2="748" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="754" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="780" cy="348" r="15" fill="#EEF2FF"/>
    <text x="780" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">8</text>
    <text x="804" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Decifrar</text>
    <line x1="774" y1="372" x2="939" y2="372" stroke="#E2E8F0"/>
    <text x="774" y="398" font-size="10.1" fill="#475569">O texto claro volta para quem chamou;</text>
    <text x="774" y="416" font-size="10.3" fill="#475569">em caso de falha os detalhes não</text>
    <text x="774" y="434" font-size="11" fill="#475569">vazam para o cliente.</text>
  </g>

  <!-- ═══ maintenance & failures ═══ -->
  <text x="40" y="492" font-size="11" fill="#94A3B8" letter-spacing="1">MANUTENÇÃO E MODOS DE FALHA</text>
  <rect x="40" y="504" width="440" height="112" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="60" y="532" font-size="13.5" font-weight="700" fill="#9A3412">Rotação e migração</text>
  <circle cx="66" cy="554" r="2.5" fill="#F59E0B"/><text x="78" y="558" font-size="9.9" fill="#7C2D12">Guarde o identificador (e o prefixo v1) junto de cada registro</text>
  <circle cx="66" cy="573" r="2.5" fill="#F59E0B"/><text x="78" y="577" font-size="11" fill="#7C2D12">Decifre com a chave antiga e recifre com a nova</text>
  <circle cx="66" cy="592" r="2.5" fill="#F59E0B"/><text x="78" y="596" font-size="11" fill="#7C2D12">setDefaultIdentifier() troca o padrão sem tocar nos call sites</text>

  <rect x="520" y="504" width="440" height="112" rx="14" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="540" y="532" font-size="13.5" font-weight="700" fill="#991B1B">Falhas lançam EncryptionException</text>
  <circle cx="546" cy="554" r="2.5" fill="#EF4444"/><text x="558" y="558" font-size="11" fill="#7F1D1D">Prefixo inválido, cifra curta demais</text>
  <circle cx="546" cy="573" r="2.5" fill="#EF4444"/><text x="558" y="577" font-size="10.3" fill="#7F1D1D">Tag ou MAC divergente — adulteração ou chave errada</text>
  <circle cx="546" cy="592" r="2.5" fill="#EF4444"/><text x="558" y="596" font-size="8.5" fill="#7F1D1D">Identificador desconhecido, algoritmo não registrado, chave de tamanho errado</text>

  <text x="40" y="644" font-size="9.5" fill="#94A3B8">O bootstrap acontece uma vez por processo (a factory registra todos os encryptors de uma vez); cifrar e decifrar são o caminho quente de cada requisição.</text>
</svg>
