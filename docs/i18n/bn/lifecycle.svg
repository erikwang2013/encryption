    <text x="566" y="353" font-size="14.5" font-weight="700" fill="#0F172A">যাচাই</text>
    <line x1="536" y1="372" x2="701" y2="372" stroke="#E2E8F0"/>
    <text x="536" y="398" font-size="10.3" fill="#475569">প্রিফিক্স ও দৈর্ঘ্য যাচাই হয়</text>
    <text x="536" y="416" font-size="11" fill="#475569">ট্যাগ / MAC তুলনার আগে,</text>
    <text x="536" y="434" font-size="9.7" fill="#475569">কনস্ট্যান্ট-টাইমে।</text>
    <text x="536" y="452" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hash_equals()</text>
