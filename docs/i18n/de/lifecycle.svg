<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="lifeTitle lifeDesc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="lifeTitle">Anfrage-Lebenszyklus — erikwang2013/encryption</title>
  <desc id="lifeDesc">Lebenszyklus eines geschützten Werts: einen 32 Byte langen Master-Key bereitstellen, Unterschlüssel je Algorithmus ableiten, Implementierungen registrieren, mit einem zufälligen IV verschlüsseln, den versionierten Blob speichern und anschließend auflösen, prüfen und entschlüsseln; dazu Rotation und Fehlerfälle.</desc>

  <defs>
    <marker id="lcArw" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#0F172A">Anfrage-Lebenszyklus</text>
  <text x="40" y="72" font-size="12.3" fill="#64748B">Vom Master-Key zum Klartext und zurück — Bootstrap, Schreibpfad der Verschlüsselung, Lesepfad der Entschlüsselung, Rotation und Fehlerfälle</text>

  <text x="40" y="104" font-size="11" fill="#94A3B8" letter-spacing="1">SCHREIBPFAD</text>
  <text x="40" y="308" font-size="11" fill="#94A3B8" letter-spacing="1">LESEPFAD</text>

  <!-- ═══ write path ═══ -->
  <g>
    <rect x="40" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="66" cy="144" r="15" fill="#EEF2FF"/>
    <text x="66" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">1</text>
    <text x="90" y="149" font-size="14.5" font-weight="700" fill="#0F172A">Bereitstellen</text>
    <line x1="60" y1="168" x2="225" y2="168" stroke="#E2E8F0"/>
    <text x="60" y="194" font-size="10.6" fill="#475569">32-Byte-Key aus env oder KMS,</text>
    <text x="60" y="212" font-size="8.6" fill="#475569">niemals ein rohes Passwort.</text>
    <text x="60" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">base64_decode($envKey)</text>
  </g>
  <line x1="245" y1="185" x2="272" y2="185" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="278" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="304" cy="144" r="15" fill="#EEF2FF"/>
    <text x="304" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">2</text>
    <text x="328" y="149" font-size="14.5" font-weight="700" fill="#0F172A">Ableiten</text>
    <line x1="298" y1="168" x2="463" y2="168" stroke="#E2E8F0"/>
    <text x="298" y="194" font-size="8.6" fill="#475569">Ein Unterschlüssel je Verfahren,</text>
    <text x="298" y="212" font-size="8.6" fill="#475569">keine Schlüsselwiederverwendung.</text>
    <text x="298" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dgn:derive:aes-gcm</text>
  </g>
  <line x1="483" y1="185" x2="510" y2="185" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="516" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="542" cy="144" r="15" fill="#EEF2FF"/>
    <text x="542" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">3</text>
    <text x="566" y="149" font-size="14.5" font-weight="700" fill="#0F172A">Registrieren</text>
    <line x1="536" y1="168" x2="701" y2="168" stroke="#E2E8F0"/>
    <text x="536" y="194" font-size="11" fill="#475569">Implementierung liegt unter</text>
    <text x="536" y="212" font-size="8.8" fill="#475569">ihrem eigenen getIdentifier().</text>
    <text x="536" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$registry-&gt;register($cipher)</text>
  </g>
  <line x1="721" y1="185" x2="748" y2="185" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="754" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="780" cy="144" r="15" fill="#EEF2FF"/>
    <text x="780" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">4</text>
    <text x="804" y="149" font-size="14.5" font-weight="700" fill="#0F172A">Verschlüsseln</text>
    <line x1="774" y1="168" x2="939" y2="168" stroke="#E2E8F0"/>
    <text x="774" y="194" font-size="9" fill="#475569">Zufälliger IV / Nonce pro Aufruf,</text>
    <text x="774" y="212" font-size="10.3" fill="#475569">AEAD-Tag oder Encrypt-then-MAC.</text>
    <text x="774" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$manager-&gt;encrypt($data)</text>
  </g>

  <!-- wrap to read path -->
  <path d="M856 258 V278 H142 V310" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>

  <!-- ═══ read path ═══ -->
  <g>
    <rect x="40" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="66" cy="348" r="15" fill="#EEF2FF"/>
    <text x="66" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">5</text>
    <text x="90" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Speichern</text>
    <line x1="60" y1="372" x2="225" y2="372" stroke="#E2E8F0"/>
    <text x="60" y="398" font-size="9.4" fill="#475569">Binärer Blob in einer BLOB-Spalte,</text>
    <text x="60" y="416" font-size="11" fill="#475569">oder base64 für Textablage.</text>
    <text x="60" y="440" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">v1 | IV | tag | ciphertext</text>
  </g>
  <line x1="245" y1="389" x2="272" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="278" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="304" cy="348" r="15" fill="#EEF2FF"/>
    <text x="304" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">6</text>
    <text x="328" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Auflösen</text>
    <line x1="298" y1="372" x2="463" y2="372" stroke="#E2E8F0"/>
    <text x="298" y="398" font-size="9.7" fill="#475569">Der mit dem Datensatz gespeicherte</text>
    <text x="298" y="416" font-size="10.1" fill="#475569">Bezeichner wählt die Implementierung,</text>
    <text x="298" y="434" font-size="9.1" fill="#475569">alte Daten bleiben entschlüsselbar.</text>
  </g>
  <line x1="483" y1="389" x2="510" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="516" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="542" cy="348" r="15" fill="#EEF2FF"/>
    <text x="542" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">7</text>
    <text x="566" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Prüfen</text>
    <line x1="536" y1="372" x2="701" y2="372" stroke="#E2E8F0"/>
    <text x="536" y="398" font-size="10.2" fill="#475569">Präfix und Länge werden geprüft</text>
    <text x="536" y="416" font-size="10.7" fill="#475569">bevor Tag / MAC verglichen werden</text>
    <text x="536" y="434" font-size="9.8" fill="#475569">in konstanter Zeit.</text>
    <text x="536" y="452" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hash_equals()</text>
  </g>
  <line x1="721" y1="389" x2="748" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="754" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="780" cy="348" r="15" fill="#EEF2FF"/>
    <text x="780" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">8</text>
    <text x="804" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Entschlüsseln</text>
    <line x1="774" y1="372" x2="939" y2="372" stroke="#E2E8F0"/>
    <text x="774" y="398" font-size="9.8" fill="#475569">Der Klartext geht zurück zum Aufrufer;</text>
    <text x="774" y="416" font-size="9.7" fill="#475569">im Fehlerfall werden keine Details</text>
    <text x="774" y="434" font-size="8.5" fill="#475569">an den Client weitergegeben.</text>
  </g>

  <!-- ═══ maintenance & failures ═══ -->
  <text x="40" y="492" font-size="11" fill="#94A3B8" letter-spacing="1">WARTUNG &amp; FEHLERFÄLLE</text>
  <rect x="40" y="504" width="440" height="112" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="60" y="532" font-size="13.5" font-weight="700" fill="#9A3412">Rotation &amp; Migration</text>
  <circle cx="66" cy="554" r="2.5" fill="#F59E0B"/><text x="78" y="558" font-size="11" fill="#7C2D12">Bezeichner (und v1-Präfix) bei jedem Datensatz mitführen</text>
  <circle cx="66" cy="573" r="2.5" fill="#F59E0B"/><text x="78" y="577" font-size="9.1" fill="#7C2D12">Mit dem alten Key entschlüsseln, mit dem neuen neu verschlüsseln</text>
  <circle cx="66" cy="592" r="2.5" fill="#F59E0B"/><text x="78" y="596" font-size="9.9" fill="#7C2D12">setDefaultIdentifier() wechselt den Standard, Aufrufer bleiben unberührt</text>

  <rect x="520" y="504" width="440" height="112" rx="14" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="540" y="532" font-size="13.5" font-weight="700" fill="#991B1B">Fehler werfen EncryptionException</text>
  <circle cx="546" cy="554" r="2.5" fill="#EF4444"/><text x="558" y="558" font-size="10.7" fill="#7F1D1D">Ungültiges Präfix, Ciphertext zu kurz</text>
  <circle cx="546" cy="573" r="2.5" fill="#EF4444"/><text x="558" y="577" font-size="9.3" fill="#7F1D1D">Tag- oder MAC-Abweichung — Manipulation oder falscher Key</text>
  <circle cx="546" cy="592" r="2.5" fill="#EF4444"/><text x="558" y="596" font-size="8.5" fill="#7F1D1D">Unbekannter Bezeichner, nicht registrierter Algorithmus, falsche Schlüssellänge</text>

  <text x="40" y="644" font-size="9.5" fill="#94A3B8">Das Bootstrap erfolgt einmal pro Prozess (die Factory registriert alle Verschlüsseler auf einmal); Ver- und Entschlüsselung sind der Hot Path pro Anfrage.</text>
</svg>
