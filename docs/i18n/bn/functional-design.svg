<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 716" width="1000" height="716" role="img" aria-labelledby="featTitle featDesc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="featTitle">কার্যকরী ডিজাইন — erikwang2013/encryption</title>
  <desc id="featDesc">লাইব্রেরির সক্ষমতার মানচিত্র: সিমেট্রিক এনক্রিপশন, অ্যাসিমেট্রিক এনক্রিপশন, হ্যাশিং, কী ডেরিভেশন, পাসওয়ার্ড-ভিত্তিক KDF ও চীনা জাতীয় অ্যালগরিদম, সঙ্গে ডিজাইন নীতি, নিরাপত্তার ডিফল্ট ও সম্প্রসারণের পথ।</desc>

  <rect x="0" y="0" width="1000" height="716" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#0F172A">কার্যকরী ডিজাইন</text>
  <text x="40" y="72" font-size="13.5" fill="#64748B">ছয়টি সক্ষমতা পরিবার, একই গড়ন — কন্ট্রাক্ট ইন্টারফেস, রেজিস্ট্রি, ফ্যাসাড, অন্তর্ভুক্ত আইডেন্টিফায়ার</text>

  <!-- ══════ card 1 : symmetric ══════ -->
  <rect x="40" y="96" width="276" height="200" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
