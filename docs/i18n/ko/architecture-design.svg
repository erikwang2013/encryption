  <text x="220" y="789" font-size="11" fill="#475569"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#334155">EncryptionException</tspan> (모든 실패) · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#334155">UnsupportedNationalAlgorithmException</tspan> (SM1 / SM7 / SM9은 미제공)</text>
