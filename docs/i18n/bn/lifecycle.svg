  <!-- ═══ maintenance & failures ═══ -->
  <text x="40" y="492" font-size="11" fill="#94A3B8" letter-spacing="1">রক্ষণাবেক্ষণ ও ব্যর্থতার ধরন</text>
  <rect x="40" y="504" width="440" height="112" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="60" y="532" font-size="13.5" font-weight="700" fill="#9A3412">রোটেশন ও মাইগ্রেশন</text>
  <circle cx="66" cy="554" r="2.5" fill="#F59E0B"/><text x="78" y="558" font-size="9.8" fill="#7C2D12">প্রতিটি রেকর্ডের পাশে আইডেন্টিফায়ার (ও v1 প্রিফিক্স) রাখুন</text>
  <circle cx="66" cy="573" r="2.5" fill="#F59E0B"/><text x="78" y="577" font-size="9.6" fill="#7C2D12">পুরনো কী দিয়ে ডিক্রিপ্ট, নতুন কী দিয়ে পুনরায় এনক্রিপ্ট</text>
  <circle cx="66" cy="592" r="2.5" fill="#F59E0B"/><text x="78" y="596" font-size="11" fill="#7C2D12">setDefaultIdentifier() ডিফল্ট বদলায়, কল সাইট অপরিবর্তিত</text>

  <rect x="520" y="504" width="440" height="112" rx="14" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="540" y="532" font-size="13.5" font-weight="700" fill="#991B1B">ব্যর্থতায় EncryptionException ছোড়ে</text>
  <circle cx="546" cy="554" r="2.5" fill="#EF4444"/><text x="558" y="558" font-size="10.3" fill="#7F1D1D">অবৈধ প্রিফিক্স, সাইফারটেক্সট খুব ছোট</text>
  <circle cx="546" cy="573" r="2.5" fill="#EF4444"/><text x="558" y="577" font-size="11" fill="#7F1D1D">ট্যাগ বা MAC মিলছে না — টেম্পারিং বা ভুল কী</text>
  <circle cx="546" cy="592" r="2.5" fill="#EF4444"/><text x="558" y="596" font-size="10.3" fill="#7F1D1D">অজানা আইডেন্টিফায়ার, অনিবন্ধিত অ্যালগরিদম, ভুল কী দৈর্ঘ্য</text>

  <text x="40" y="644" font-size="9.7" fill="#94A3B8">বুটস্ট্র্যাপ হয় প্রক্রিয়া-প্রতি একবার (ফ্যাক্টরি একবারেই সব এনক্রিপ্টর রেজিস্টার করে); এনক্রিপ্ট ও ডিক্রিপ্ট হলো প্রতি-রিকোয়েস্টের হট পাথ।</text>
