    <text x="328" y="353" font-size="14.5" font-weight="700" fill="#0F172A">حل</text>
    <line x1="298" y1="372" x2="463" y2="372" stroke="#E2E8F0"/>
    <text x="298" y="398" font-size="11" fill="#475569">المعرّف المخزَّن مع</text>
    <text x="298" y="416" font-size="11" fill="#475569">السجل يحدّد التطبيق،</text>
    <text x="298" y="434" font-size="9.1" fill="#475569">فتبقى البيانات قابلة لفك التشفير.</text>
  </g>
  <line x1="483" y1="389" x2="510" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="516" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="542" cy="348" r="15" fill="#EEF2FF"/>
    <text x="542" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">7</text>
    <text x="566" y="353" font-size="14.5" font-weight="700" fill="#0F172A">تحقق</text>
    <line x1="536" y1="372" x2="701" y2="372" stroke="#E2E8F0"/>
    <text x="536" y="398" font-size="11" fill="#475569">تُفحَص البادئة والطول</text>
    <text x="536" y="416" font-size="11" fill="#475569">قبل مقارنة العلامة / MAC</text>
    <text x="536" y="434" font-size="11" fill="#475569">بزمن ثابت.</text>
    <text x="536" y="452" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hash_equals()</text>
