<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="lifeTitle lifeDesc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="lifeTitle">Cycle de vie d'une requête — erikwang2013/encryption</title>
  <desc id="lifeDesc">Cycle de vie d'une valeur protégée : provisionner une clé maîtresse de 32 octets, dériver les sous-clés par algorithme, enregistrer les implémentations, chiffrer avec un IV aléatoire, persister le blob versionné, puis résoudre, vérifier et déchiffrer ; plus la rotation et les modes de défaillance.</desc>

  <defs>
    <marker id="lcArw" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#0F172A">Cycle d'une requête</text>
  <text x="40" y="72" font-size="14" fill="#64748B">De la clé maîtresse au texte en clair et retour — bootstrap, écriture, lecture, rotation et modes de défaillance</text>

  <text x="40" y="104" font-size="11" fill="#94A3B8" letter-spacing="1">ÉCRITURE</text>
  <text x="40" y="308" font-size="11" fill="#94A3B8" letter-spacing="1">LECTURE</text>

  <!-- ═══ write path ═══ -->
  <g>
    <rect x="40" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="66" cy="144" r="15" fill="#EEF2FF"/>
    <text x="66" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">1</text>
    <text x="90" y="149" font-size="14.5" font-weight="700" fill="#0F172A">Provisionner</text>
    <line x1="60" y1="168" x2="225" y2="168" stroke="#E2E8F0"/>
    <text x="60" y="194" font-size="10.2" fill="#475569">clé de 32 octets (env ou KMS),</text>
    <text x="60" y="212" font-size="8.5" fill="#475569">jamais un mot de passe brut.</text>
    <text x="60" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">base64_decode($envKey)</text>
  </g>
  <line x1="245" y1="185" x2="272" y2="185" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="278" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="304" cy="144" r="15" fill="#EEF2FF"/>
    <text x="304" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">2</text>
    <text x="328" y="149" font-size="14.5" font-weight="700" fill="#0F172A">Dériver</text>
    <line x1="298" y1="168" x2="463" y2="168" stroke="#E2E8F0"/>
    <text x="298" y="194" font-size="9.8" fill="#475569">Une sous-clé par algorithme,</text>
    <text x="298" y="212" font-size="8.5" fill="#475569">pour ne jamais réutiliser de clé.</text>
    <text x="298" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dgn:derive:aes-gcm</text>
  </g>
  <line x1="483" y1="185" x2="510" y2="185" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="516" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="542" cy="144" r="15" fill="#EEF2FF"/>
    <text x="542" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">3</text>
    <text x="566" y="149" font-size="14.5" font-weight="700" fill="#0F172A">Enregistrer</text>
    <line x1="536" y1="168" x2="701" y2="168" stroke="#E2E8F0"/>
    <text x="536" y="194" font-size="10.9" fill="#475569">Implémentation stockée sous</text>
    <text x="536" y="212" font-size="9.8" fill="#475569">son propre getIdentifier().</text>
    <text x="536" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$registry-&gt;register($cipher)</text>
  </g>
  <line x1="721" y1="185" x2="748" y2="185" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="754" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="780" cy="144" r="15" fill="#EEF2FF"/>
    <text x="780" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">4</text>
    <text x="804" y="149" font-size="14.5" font-weight="700" fill="#0F172A">Chiffrer</text>
    <line x1="774" y1="168" x2="939" y2="168" stroke="#E2E8F0"/>
    <text x="774" y="194" font-size="9.6" fill="#475569">IV / nonce aléatoire par appel,</text>
    <text x="774" y="212" font-size="11" fill="#475569">tag AEAD ou encrypt-then-MAC.</text>
    <text x="774" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$manager-&gt;encrypt($data)</text>
  </g>

  <!-- wrap to read path -->
  <path d="M856 258 V278 H142 V310" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>

  <!-- ═══ read path ═══ -->
  <g>
    <rect x="40" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="66" cy="348" r="15" fill="#EEF2FF"/>
    <text x="66" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">5</text>
    <text x="90" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Persister</text>
    <line x1="60" y1="372" x2="225" y2="372" stroke="#E2E8F0"/>
    <text x="60" y="398" font-size="11" fill="#475569">blob binaire en colonne BLOB,</text>
    <text x="60" y="416" font-size="9" fill="#475569">ou base64 pour un stockage texte.</text>
    <text x="60" y="440" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">v1 | IV | tag | ciphertext</text>
  </g>
  <line x1="245" y1="389" x2="272" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="278" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="304" cy="348" r="15" fill="#EEF2FF"/>
    <text x="304" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">6</text>
    <text x="328" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Résoudre</text>
    <line x1="298" y1="372" x2="463" y2="372" stroke="#E2E8F0"/>
    <text x="298" y="398" font-size="11" fill="#475569">L'identifiant stocké avec</text>
    <text x="298" y="416" font-size="8.9" fill="#475569">l'enregistrement choisit l'implémentation,</text>
    <text x="298" y="434" font-size="8.5" fill="#475569">les anciennes données restent lisibles.</text>
  </g>
  <line x1="483" y1="389" x2="510" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="516" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="542" cy="348" r="15" fill="#EEF2FF"/>
    <text x="542" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">7</text>
    <text x="566" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Vérifier</text>
    <line x1="536" y1="372" x2="701" y2="372" stroke="#E2E8F0"/>
    <text x="536" y="398" font-size="9.6" fill="#475569">Préfixe et longueur sont vérifiés</text>
    <text x="536" y="416" font-size="9.2" fill="#475569">avant que le tag / MAC ne soit comparé</text>
    <text x="536" y="434" font-size="11" fill="#475569">à temps constant.</text>
    <text x="536" y="452" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hash_equals()</text>
  </g>
  <line x1="721" y1="389" x2="748" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="754" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="780" cy="348" r="15" fill="#EEF2FF"/>
    <text x="780" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">8</text>
    <text x="804" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Décrypter</text>
    <line x1="774" y1="372" x2="939" y2="372" stroke="#E2E8F0"/>
    <text x="774" y="398" font-size="9.3" fill="#475569">Le texte en clair revient à l'appelant ;</text>
    <text x="774" y="416" font-size="9.4" fill="#475569">en cas d'échec, les détails ne sont</text>
    <text x="774" y="434" font-size="9.6" fill="#475569">pas divulgués au client.</text>
  </g>

  <!-- ═══ maintenance & failures ═══ -->
  <text x="40" y="492" font-size="11" fill="#94A3B8" letter-spacing="1">MAINTENANCE ET DÉFAILLANCES</text>
  <rect x="40" y="504" width="440" height="112" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="60" y="532" font-size="13.5" font-weight="700" fill="#9A3412">Rotation et migration</text>
  <circle cx="66" cy="554" r="2.5" fill="#F59E0B"/><text x="78" y="558" font-size="8.9" fill="#7C2D12">Conservez l'identifiant (et le préfixe v1) avec chaque enregistrement</text>
  <circle cx="66" cy="573" r="2.5" fill="#F59E0B"/><text x="78" y="577" font-size="9.9" fill="#7C2D12">Déchiffrez avec l'ancienne clé, rechiffrez avec la nouvelle</text>
  <circle cx="66" cy="592" r="2.5" fill="#F59E0B"/><text x="78" y="596" font-size="11" fill="#7C2D12">setDefaultIdentifier() change le défaut, appels inchangés</text>

  <rect x="520" y="504" width="440" height="112" rx="14" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="540" y="532" font-size="13.5" font-weight="700" fill="#991B1B">Les défaillances lèvent EncryptionException</text>
  <circle cx="546" cy="554" r="2.5" fill="#EF4444"/><text x="558" y="558" font-size="9.4" fill="#7F1D1D">Préfixe invalide, texte chiffré trop court</text>
  <circle cx="546" cy="573" r="2.5" fill="#EF4444"/><text x="558" y="577" font-size="10.7" fill="#7F1D1D">Tag ou MAC divergent — altération ou mauvaise clé</text>
  <circle cx="546" cy="592" r="2.5" fill="#EF4444"/><text x="558" y="596" font-size="8.8" fill="#7F1D1D">Identifiant inconnu, algorithme non enregistré, mauvaise longueur de clé</text>

  <text x="40" y="644" font-size="8.5" fill="#94A3B8">Le bootstrap a lieu une fois par processus (la factory enregistre tous les chiffreurs d'un coup) ; le chiffrement et le déchiffrement forment le chemin critique de chaque requête.</text>
</svg>
