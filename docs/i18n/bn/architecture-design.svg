  <title id="archTitle">আর্কিটেকচার ডিজাইন — erikwang2013/encryption</title>
  <desc id="archDesc">চারটি সক্ষমতা পরিবার (সিমেট্রিক, অ্যাসিমেট্রিক, হ্যাশিং, কী ডেরিভেশন), প্রতিটি গঠিত একটি কন্ট্রাক্ট ইন্টারফেস, একটি রেজিস্ট্রি, একটি ফ্যাসাড ম্যানেজার ও অ্যালগরিদম ইমপ্লিমেন্টেশন থেকে, সঙ্গে মাস্টার-কী ফ্যাক্টরি ও ক্রস-কাটিং ইন্টার্নাল।</desc>

