  <!-- ═══ maintenance & failures ═══ -->
  <text x="40" y="492" font-size="11" fill="#94A3B8" letter-spacing="1">الصيانة وأنماط الفشل</text>
  <rect x="40" y="504" width="440" height="112" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="60" y="532" font-size="13.5" font-weight="700" fill="#9A3412">التدوير والترحيل</text>
  <circle cx="66" cy="554" r="2.5" fill="#F59E0B"/><text x="78" y="558" font-size="11" fill="#7C2D12">احتفظ بالمعرّف (وبادئة v1) بجانب كل سجل</text>
  <circle cx="66" cy="573" r="2.5" fill="#F59E0B"/><text x="78" y="577" font-size="10.7" fill="#7C2D12">فُكّ التشفير بالمفتاح القديم، وأعِد التشفير بالجديد</text>
  <circle cx="66" cy="592" r="2.5" fill="#F59E0B"/><text x="78" y="596" font-size="10.4" fill="#7C2D12">تبديل الافتراضي عبر setDefaultIdentifier() دون لمس مواضع الاستدعاء</text>

  <rect x="520" y="504" width="440" height="112" rx="14" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="540" y="532" font-size="13.5" font-weight="700" fill="#991B1B">حالات الفشل ترفع EncryptionException</text>
  <circle cx="546" cy="554" r="2.5" fill="#EF4444"/><text x="558" y="558" font-size="8.5" fill="#7F1D1D">بادئة غير صحيحة، أو نص مشفَّر أقصر من اللازم</text>
  <circle cx="546" cy="573" r="2.5" fill="#EF4444"/><text x="558" y="577" font-size="10.9" fill="#7F1D1D">عدم تطابق العلامة أو MAC — تلاعب أو مفتاح خاطئ</text>
  <circle cx="546" cy="592" r="2.5" fill="#EF4444"/><text x="558" y="596" font-size="10.3" fill="#7F1D1D">معرّف مجهول، أو خوارزمية غير مسجّلة، أو طول مفتاح غير صحيح</text>

  <text x="40" y="644" font-size="10.4" fill="#94A3B8">تُنفَّذ التهيئة مرة واحدة لكل عملية (إذ يسجّل المصنع كل المشفّرات دفعة واحدة)؛ أما التشفير وفك التشفير فهما المسار الساخن في كل طلب.</text>
