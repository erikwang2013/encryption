  <g font-size="10.5" fill="#94A3B8" text-anchor="middle">
    <text x="292" y="733">Encrypt-then-MAC-Blob · v1 | IV | tag/MAC | ciphertext</text>
    <text x="490" y="588" font-size="10.4">benötigt ext-gmp</text>
    <text x="490" y="604" font-size="8.5">Schlüssel und Ciphertext als Hex</text>
    <text x="688" y="622" font-size="9.3">32-Byte-Hashwerte</text>
    <text x="886" y="622" font-size="9.2">zufälliges Salt · base64 für Text</text>
  </g>

  <!-- ═══ factory rail ═══ -->
  <rect x="24" y="196" width="164" height="298" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="38" y="222" font-size="12" font-weight="700" fill="#9A3412">EncryptionManager</text>
  <text x="38" y="237" font-size="12" font-weight="700" fill="#9A3412">Factory</text>
  <text x="38" y="258" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#C2410C">fromMasterKey(</text>
  <text x="38" y="271" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#C2410C">  $master32, $default)</text>
  <text x="38" y="294" font-size="8.6" fill="#7C2D12">Leitet je Algorithmus einen</text>
  <text x="38" y="308" font-size="9.1" fill="#7C2D12">Unterschlüssel mit HMAC-SHA256</text>
  <text x="38" y="322" font-size="10.5" fill="#7C2D12">(eigenes Info-Label) ab und</text>
  <text x="38" y="336" font-size="9.1" fill="#7C2D12">registriert alle Verschlüsseler</text>
  <text x="38" y="350" font-size="8.5" fill="#7C2D12">auf einmal und liefert den Manager.</text>
  <text x="38" y="374" font-size="10" fill="#C2410C">Der Master-Key muss exakt</text>
  <text x="38" y="387" font-size="10" fill="#C2410C">32 Byte sein, sonst Fehler.</text>
  <text x="38" y="411" font-size="8.5" fill="#C2410C">ext-sodium ergänzt</text>
  <text x="38" y="424" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#C2410C">sodium-xchacha20</text>
  <text x="38" y="437" font-size="10" fill="#C2410C">automatisch.</text>
  <text x="38" y="461" font-size="8.5" fill="#C2410C">SM2 benötigt ext-gmp.</text>
  <line x1="188" y1="343" x2="200" y2="343" stroke="#F59E0B" stroke-width="2" marker-end="url(#arwRail)"/>

