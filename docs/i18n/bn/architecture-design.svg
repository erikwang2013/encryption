  <text x="40" y="72" font-size="13.4" fill="#64748B">চারটি সক্ষমতা পরিবার · কন্ট্রাক্ট → রেজিস্ট্রি → ফ্যাসাড → ইমপ্লিমেন্টেশন · নেমস্পেস Erikwang2013\Encryption</text>

