  <circle cx="388" cy="645" r="2.5" fill="#059669"/><text x="400" y="649" font-size="8.7" fill="#475569">৩২ বাইটের মাস্টার কী বাধ্যতামূলক</text>

  <rect x="684" y="536" width="276" height="140" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="704" y="566" font-size="13.5" font-weight="700" fill="#0F172A">সম্প্রসারণ — নতুন অ্যালগরিদম</text>
  <circle cx="710" cy="588" r="2.5" fill="#D97706"/><text x="722" y="592" font-size="8.5" fill="#475569">1. পরিবারের কন্ট্রাক্ট ইমপ্লিমেন্ট করুন</text>
  <circle cx="710" cy="607" r="2.5" fill="#D97706"/><text x="722" y="611" font-size="9.4" fill="#475569">2. ইউনিক আইডেন্টিফায়ার ফেরত দিন</text>
  <circle cx="710" cy="626" r="2.5" fill="#D97706"/><text x="722" y="630" font-size="8.9" fill="#475569">3. রেজিস্ট্রিতে সেটি রেজিস্টার করুন</text>
  <circle cx="710" cy="645" r="2.5" fill="#D97706"/><text x="722" y="649" font-size="9.8" fill="#475569">4. যেকোনো ফ্যাসাড দিয়ে রিজলভ করুন</text>

  <text x="40" y="700" font-size="10.6" fill="#94A3B8">প্রতিটি পরিবারের গড়ন একই, তাই নতুন অ্যালগরিদম মানে একটি নতুন ক্লাস আর একটি register() কল — অ্যাপ্লিকেশন কোড কেবল ইন্টারফেসের উপরই নির্ভর করে থাকে।</text>
