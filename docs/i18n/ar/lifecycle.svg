  <title id="lifeTitle">دورة حياة الطلب — erikwang2013/encryption</title>
  <desc id="lifeDesc">دورة حياة قيمة محمية: توفير مفتاح رئيسي بطول 32 بايت، واشتقاق مفاتيح فرعية لكل خوارزمية، وتسجيل التطبيقات، والتشفير بـ IV عشوائي، وحفظ الحمولة ذات الإصدار، ثم الحل والتحقق وفك التشفير؛ إضافة إلى التدوير وأنماط الفشل.</desc>

  <defs>
    <marker id="lcArw" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#0F172A">دورة حياة الطلب</text>
  <text x="40" y="72" font-size="12.7" fill="#64748B">من المفتاح الرئيسي إلى النص الأصلي والعودة — التهيئة، ومسار الكتابة بالتشفير، ومسار القراءة بفك التشفير، والتدوير وأنماط الفشل</text>

  <text x="40" y="104" font-size="11" fill="#94A3B8" letter-spacing="1">مسار كتابة</text>
  <text x="40" y="308" font-size="11" fill="#94A3B8" letter-spacing="1">مسار قراءة</text>

  <!-- ═══ write path ═══ -->
  <g>
    <rect x="40" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="66" cy="144" r="15" fill="#EEF2FF"/>
    <text x="66" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">1</text>
    <text x="90" y="149" font-size="14.5" font-weight="700" fill="#0F172A">توفير</text>
    <line x1="60" y1="168" x2="225" y2="168" stroke="#E2E8F0"/>
    <text x="60" y="194" font-size="8.5" fill="#475569">مفتاح بطول 32 بايت من البيئة أو KMS،</text>
    <text x="60" y="212" font-size="8.5" fill="#475569">وليس كلمة مرور خامة أبدًا.</text>
    <text x="60" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">base64_decode($envKey)</text>
  </g>
  <line x1="245" y1="185" x2="272" y2="185" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
