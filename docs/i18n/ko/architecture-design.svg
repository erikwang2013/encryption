  <title id="archTitle">아키텍처 설계 — erikwang2013/encryption</title>
  <desc id="archDesc">네 개의 기능 패밀리(대칭키, 비대칭키, 해싱, 키 유도)로, 각각 계약 인터페이스·레지스트리·파사드 매니저·알고리즘 구현체로 구성됩니다. 여기에 마스터 키 팩토리와 공통 내부 요소가 더해집니다.</desc>

  <defs>
