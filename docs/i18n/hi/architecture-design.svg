    <text x="886" y="622" font-size="8.5">यादृच्छिक salt · टेक्स्ट हेतु base64</text>
  </g>

  <!-- ═══ factory rail ═══ -->
  <rect x="24" y="196" width="164" height="298" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="38" y="222" font-size="12" font-weight="700" fill="#9A3412">EncryptionManager</text>
  <text x="38" y="237" font-size="9.8" font-weight="700" fill="#9A3412">फ़ैक्टरी</text>
  <text x="38" y="258" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#C2410C">fromMasterKey(</text>
  <text x="38" y="271" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#C2410C">  $master32, $default)</text>
  <text x="38" y="294" font-size="9.4" fill="#7C2D12">हर एल्गोरिदम एक उपकुंजी</text>
  <text x="38" y="308" font-size="10.5" fill="#7C2D12">HMAC-SHA256 के साथ</text>
  <text x="38" y="322" font-size="10.5" fill="#7C2D12">(अलग info लेबल), फिर</text>
  <text x="38" y="336" font-size="8.6" fill="#7C2D12">सभी एन्क्रिप्टर रजिस्टर करता है</text>
  <text x="38" y="350" font-size="10.5" fill="#7C2D12">और मैनेजर लौटाता है।</text>
  <text x="38" y="374" font-size="10" fill="#C2410C">मास्टर कुंजी बिल्कुल</text>
  <text x="38" y="387" font-size="8.5" fill="#C2410C">32 बाइट होनी चाहिए, वरना अपवाद।</text>
  <text x="38" y="411" font-size="9.2" fill="#C2410C">ext-sodium स्वतः</text>
  <text x="38" y="424" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#C2410C">sodium-xchacha20</text>
  <text x="38" y="437" font-size="10" fill="#C2410C">जोड़ देता है।</text>
  <text x="38" y="461" font-size="8.5" fill="#C2410C">SM2 को ext-gmp चाहिए।</text>
