  <g font-size="10.5" fill="#94A3B8" text-anchor="middle">
    <text x="292" y="733">blob encrypt-then-MAC · v1 | IV | tag/MAC | ciphertext</text>
    <text x="490" y="588">requiere ext-gmp</text>
    <text x="490" y="604" font-size="9.4">claves y texto cifrado en hex</text>
    <text x="688" y="622" font-size="8.5">resumen de 32 bytes</text>
    <text x="886" y="622" font-size="9.2">sal aleatoria · base64 para texto</text>
  </g>

  <!-- ═══ factory rail ═══ -->
  <rect x="24" y="196" width="164" height="298" rx="12" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="38" y="222" font-size="12" font-weight="700" fill="#9A3412">EncryptionManager</text>
  <text x="38" y="237" font-size="10.4" font-weight="700" fill="#9A3412">Factoría</text>
  <text x="38" y="258" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#C2410C">fromMasterKey(</text>
  <text x="38" y="271" font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#C2410C">  $master32, $default)</text>
  <text x="38" y="294" font-size="10" fill="#7C2D12">Deriva una subclave por</text>
  <text x="38" y="308" font-size="10.5" fill="#7C2D12">algoritmo con HMAC-SHA256</text>
  <text x="38" y="322" font-size="9.1" fill="#7C2D12">(etiqueta info distinta), luego</text>
  <text x="38" y="336" font-size="9.8" fill="#7C2D12">registra todos los cifradores</text>
  <text x="38" y="350" font-size="8.9" fill="#7C2D12">de una vez y devuelve un gestor.</text>
  <text x="38" y="374" font-size="9.6" fill="#C2410C">La clave maestra debe tener</text>
  <text x="38" y="387" font-size="8.7" fill="#C2410C">32 bytes exactos o lanza error.</text>
  <text x="38" y="411" font-size="9.3" fill="#C2410C">ext-sodium añade</text>
  <text x="38" y="424" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#C2410C">sodium-xchacha20</text>
  <text x="38" y="437" font-size="8.7" fill="#C2410C">automáticamente.</text>
  <text x="38" y="461" font-size="8.6" fill="#C2410C">SM2 necesita ext-gmp.</text>
  <line x1="188" y1="343" x2="200" y2="343" stroke="#F59E0B" stroke-width="2" marker-end="url(#arwRail)"/>

  <!-- ═══ cross-cutting ═══ -->
  <rect x="204" y="752" width="770" height="46" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="7 5"/>
  <text x="220" y="771" font-size="11" fill="#475569">Transversales: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#334155">src/Internal/EncryptThenMacBlob.php</tspan> (trait encrypt-then-MAC) · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#334155">src/Exception/</tspan></text>
  <text x="220" y="789" font-size="10.9" fill="#475569"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#334155">EncryptionException</tspan> (todos los fallos) · <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#334155">UnsupportedNationalAlgorithmException</tspan> (SM1 / SM7 / SM9 no incluidos)</text>
