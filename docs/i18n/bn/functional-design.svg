  <text x="60" y="444" font-size="11" fill="#475569">RFC 5869 অনুযায়ী উচ্চ-এনট্রপি</text>
  <text x="60" y="458" font-size="9.1" fill="#475569">কী মেটেরিয়ালকে উদ্দেশ্য-ভিত্তিক সাব-কী-তে:</text>
  <text x="60" y="472" font-size="11" fill="#475569">derive($ikm, $salt, $length, $info).</text>
  <text x="60" y="498" font-size="9.2" fill="#B45309">পাসওয়ার্ড প্রসারিত করতে এটি কখনও নয়।</text>
  <text x="60" y="512" font-size="11" fill="#475569">PHP-এর hash_hkdf() দিয়ে তৈরি।</text>

