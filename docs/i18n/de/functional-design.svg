<?xml version="1.0" encoding="UTF-8"?>
<!-- Generated from docs/functional-design.svg by scripts/i18n-build-svg.php (de) — edit docs/i18n/labels/de.json instead. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 716" width="1000" height="716" role="img" aria-labelledby="featTitle featDesc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="featTitle">Funktionales Design — erikwang2013/encryption</title>
  <desc id="featDesc">Fähigkeitskarte der Bibliothek: symmetrische Verschlüsselung, asymmetrische Verschlüsselung, Hashing, Schlüsselableitung, passwortbasierte KDF und chinesische Nationalalgorithmen, dazu Designprinzipien, sichere Standardwerte und der Weg zur Erweiterbarkeit.</desc>

  <rect x="0" y="0" width="1000" height="716" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#0F172A">Funktionales Design</text>
  <text x="40" y="72" font-size="14" fill="#64748B">Sechs Fähigkeitsfamilien mit einer Struktur — Vertrags-Interface, Registry, Fassade, Bezeichner</text>

  <!-- ══════ card 1 : symmetric ══════ -->
  <rect x="40" y="96" width="276" height="200" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
  <circle cx="70" cy="130" r="17" fill="#EEF2FF"/>
  <text x="70" y="136" font-size="15" font-weight="700" fill="#4338CA" text-anchor="middle">S</text>
  <text x="98" y="126" font-size="14.5" font-weight="700" fill="#0F172A">Symmetrische Chiffren</text>
  <text x="98" y="144" font-size="10.5" fill="#64748B">EncryptorRegistry · EncryptionManager</text>
  <line x1="60" y1="166" x2="296" y2="166" stroke="#E2E8F0"/>
  <rect x="60" y="176" width="93" height="23" rx="11" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="106.5" y="191.5" font-size="11" fill="#3730A3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aes-256-gcm</text>
  <rect x="161" y="176" width="126" height="23" rx="11" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="224" y="191.5" font-size="11" fill="#3730A3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sodium-xchacha20</text>
  <rect x="60" y="206" width="126" height="23" rx="11" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="123" y="221.5" font-size="11" fill="#3730A3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aes-256-cbc-hmac</text>
  <rect x="194" y="206" width="66" height="23" rx="11" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="227" y="221.5" font-size="11" fill="#3730A3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sm4-cbc</text>
  <rect x="60" y="236" width="66" height="23" rx="11" fill="#EEF2FF" stroke="#C7D2FE"/>
  <text x="93" y="251.5" font-size="11" fill="#3730A3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">zuc-128</text>
  <text x="60" y="278" font-size="8.6" fill="#475569">Ein Schlüssel pro Instanz, zufälliger IV pro Aufruf.</text>
  <text x="60" y="292" font-size="10.2" fill="#475569">Binäre Nutzdaten, AEAD oder Encrypt-then-MAC</text>

  <!-- ══════ card 2 : asymmetric ══════ -->
  <rect x="362" y="96" width="276" height="200" rx="14" fill="#FFFFFF" stroke="#C4B5FD"/>
  <circle cx="392" cy="130" r="17" fill="#F5F3FF"/>
  <text x="392" y="136" font-size="15" font-weight="700" fill="#6D28D9" text-anchor="middle">A</text>
  <text x="420" y="126" font-size="14.5" font-weight="700" fill="#0F172A">Asymmetrische Chiffren</text>
  <text x="420" y="144" font-size="10.5" fill="#64748B">AsymmetricCipherRegistry ·</text>
  <text x="420" y="157" font-size="10.5" fill="#64748B">AsymmetricCryptoManager</text>
  <line x1="382" y1="166" x2="618" y2="166" stroke="#E2E8F0"/>
  <rect x="382" y="176" width="40" height="23" rx="11" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="402" y="191.5" font-size="11" fill="#5B21B6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sm2</text>
  <text x="382" y="224" font-size="9.9" fill="#475569">Schlüsselpaar wird pro Aufruf übergeben —</text>
  <text x="382" y="238" font-size="8.9" fill="#475569">Public Key verschlüsselt, Private Key entschlüsselt.</text>
  <text x="382" y="252" font-size="11" fill="#475569">Schlüssel und Ciphertext als Hex-Strings.</text>
  <text x="382" y="278" font-size="11" fill="#B45309">Benötigt ext-gmp (GMP-Big-Integers).</text>
  <text x="382" y="292" font-size="9.5" fill="#475569">Sm2EncryptionService bietet eine statische Fassade.</text>

  <!-- ══════ card 3 : hashing ══════ -->
  <rect x="684" y="96" width="276" height="200" rx="14" fill="#FFFFFF" stroke="#67E8F9"/>
  <circle cx="714" cy="130" r="17" fill="#ECFEFF"/>
  <text x="714" y="136" font-size="15" font-weight="700" fill="#0E7490" text-anchor="middle">H</text>
  <text x="742" y="126" font-size="14.5" font-weight="700" fill="#0F172A">Hashing</text>
  <text x="742" y="144" font-size="10.5" fill="#64748B">HasherRegistry · HashingManager</text>
  <line x1="704" y1="166" x2="940" y2="166" stroke="#E2E8F0"/>
  <rect x="704" y="176" width="60" height="23" rx="11" fill="#ECFEFF" stroke="#67E8F9"/>
  <text x="734" y="191.5" font-size="11" fill="#155E75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sha256</text>
  <rect x="772" y="176" width="40" height="23" rx="11" fill="#ECFEFF" stroke="#67E8F9"/>
  <text x="792" y="191.5" font-size="11" fill="#155E75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sm3</text>
  <text x="704" y="224" font-size="8.8" fill="#475569">Einweg-Hashwerte, kein Schlüsselmaterial,</text>
  <text x="704" y="238" font-size="10.1" fill="#475569">32-Byte-Ausgabe für beide Algorithmen.</text>
  <text x="704" y="252" font-size="11" fill="#475569">digest() liefert binär, digestHex() Text.</text>
  <text x="704" y="278" font-size="9.7" fill="#475569">Für API-Signaturen und Integritätsprüfungen</text>
  <text x="704" y="292" font-size="10.2" fill="#475569">und zur internen Ableitung von MAC-Keys.</text>

  <!-- ══════ card 4 : key derivation ══════ -->
  <rect x="40" y="316" width="276" height="200" rx="14" fill="#FFFFFF" stroke="#5EEAD4"/>
  <circle cx="70" cy="350" r="17" fill="#F0FDFA"/>
  <text x="70" y="356" font-size="15" font-weight="700" fill="#0F766E" text-anchor="middle">K</text>
  <text x="98" y="346" font-size="14.5" font-weight="700" fill="#0F172A">Schlüsselableitung (IKM)</text>
  <text x="98" y="364" font-size="10.5" fill="#64748B">KeyDerivationRegistry ·</text>
  <text x="98" y="377" font-size="10.5" fill="#64748B">KeyDerivationManager</text>
  <line x1="60" y1="386" x2="296" y2="386" stroke="#E2E8F0"/>
  <rect x="60" y="396" width="86" height="23" rx="11" fill="#F0FDFA" stroke="#5EEAD4"/>
  <text x="103" y="411.5" font-size="11" fill="#115E59" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">hkdf-sha256</text>
  <text x="60" y="444" font-size="11" fill="#475569">RFC 5869: Expansion von Material</text>
  <text x="60" y="458" font-size="9.9" fill="#475569">hoher Entropie in Unterschlüssel je Zweck:</text>
  <text x="60" y="472" font-size="11" fill="#475569">derive($ikm, $salt, $length, $info).</text>
  <text x="60" y="498" font-size="8.5" fill="#B45309">Niemals zum Strecken von Passwörtern nutzen.</text>
  <text x="60" y="512" font-size="10.7" fill="#475569">Implementiert mit PHP hash_hkdf().</text>

  <!-- ══════ card 5 : password KDF ══════ -->
  <rect x="362" y="316" width="276" height="200" rx="14" fill="#FFFFFF" stroke="#FCD34D"/>
  <circle cx="392" cy="350" r="17" fill="#FFFBEB"/>
  <text x="392" y="356" font-size="15" font-weight="700" fill="#B45309" text-anchor="middle">P</text>
  <text x="420" y="346" font-size="14.5" font-weight="700" fill="#0F172A">Passwortbasierte KDF</text>
  <text x="420" y="364" font-size="10.5" fill="#64748B">PasswordBasedKdfRegistry ·</text>
  <text x="420" y="377" font-size="10.5" fill="#64748B">PasswordBasedKdfManager</text>
  <line x1="382" y1="386" x2="618" y2="386" stroke="#E2E8F0"/>
  <rect x="382" y="396" width="106" height="23" rx="11" fill="#FFFBEB" stroke="#FCD34D"/>
  <text x="435" y="411.5" font-size="11" fill="#92400E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pbkdf2-sha256</text>
  <text x="382" y="444" font-size="10.3" fill="#475569">Streckt menschliche Passwörter mit</text>
  <text x="382" y="458" font-size="10.4" fill="#475569">zufälligem Salt und fester Iterationszahl</text>
  <text x="382" y="472" font-size="10.1" fill="#475569">(Konstruktor, standardmäßig 310 000).</text>
  <text x="382" y="498" font-size="11" fill="#B45309">Salt darf nicht leer sein, sonst Fehler.</text>
  <text x="382" y="512" font-size="9.1" fill="#475569">Für Passwortspeicherung Argon2 bevorzugen.</text>

  <!-- ══════ card 6 : guomi ══════ -->
  <rect x="684" y="316" width="276" height="200" rx="14" fill="#FFFFFF" stroke="#FDA4AF"/>
  <circle cx="714" cy="350" r="17" fill="#FFF1F2"/>
  <text x="714" y="356" font-size="15" font-weight="700" fill="#BE123C" text-anchor="middle">G</text>
  <text x="742" y="346" font-size="14.5" font-weight="700" fill="#0F172A">Chinesische Nationalkrypto</text>
  <text x="742" y="364" font-size="9.1" fill="#64748B">src/Guomi — dieselben Verträge</text>
  <line x1="704" y1="386" x2="940" y2="386" stroke="#E2E8F0"/>
  <rect x="704" y="396" width="40" height="23" rx="11" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="724" y="411.5" font-size="11" fill="#9F1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sm2</text>
  <rect x="752" y="396" width="40" height="23" rx="11" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="772" y="411.5" font-size="11" fill="#9F1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sm3</text>
  <rect x="800" y="396" width="66" height="23" rx="11" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="833" y="411.5" font-size="11" fill="#9F1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sm4-cbc</text>
  <rect x="874" y="396" width="66" height="23" rx="11" fill="#FFF1F2" stroke="#FDA4AF"/>
  <text x="907" y="411.5" font-size="11" fill="#9F1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">zuc-128</text>
  <rect x="704" y="426" width="178" height="23" rx="11" fill="#FFFFFF" stroke="#FDA4AF" stroke-dasharray="5 4"/>
  <text x="793" y="441.5" font-size="11" fill="#9F1239" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SM1 / SM7 / SM9 → Exception</text>
  <text x="704" y="474" font-size="9.4" fill="#475569">Guomi ist keine eigene API: Registrieren Sie die</text>
  <text x="704" y="488" font-size="9.9" fill="#475569">Implementierung und rufen Sie sie über den</text>
  <text x="704" y="502" font-size="8.5" fill="#475569">selben Manager auf wie AES oder SHA-256.</text>

  <!-- ══════ bottom row ══════ -->
  <rect x="40" y="536" width="276" height="140" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="60" y="566" font-size="13.5" font-weight="700" fill="#0F172A">Designprinzipien</text>
  <circle cx="66" cy="588" r="2.5" fill="#6366F1"/><text x="78" y="592" font-size="11" fill="#475569">Ein Vertrag pro Fähigkeit</text>
  <circle cx="66" cy="607" r="2.5" fill="#6366F1"/><text x="78" y="611" font-size="10" fill="#475569">Registries lösen per Bezeichner auf</text>
  <circle cx="66" cy="626" r="2.5" fill="#6366F1"/><text x="78" y="630" font-size="9.8" fill="#475569">Nutzlast-Präfix ist versioniert (v1)</text>
  <circle cx="66" cy="645" r="2.5" fill="#6366F1"/><text x="78" y="649" font-size="10.5" fill="#475569">Keine Framework-Kopplung</text>

  <rect x="362" y="536" width="276" height="140" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="382" y="566" font-size="13.5" font-weight="700" fill="#0F172A">Sichere Standardwerte</text>
  <circle cx="388" cy="588" r="2.5" fill="#059669"/><text x="400" y="592" font-size="10.6" fill="#475569">Zufälliger IV / Nonce pro Aufruf</text>
  <circle cx="388" cy="607" r="2.5" fill="#059669"/><text x="400" y="611" font-size="10.2" fill="#475569">AEAD oder Encrypt-then-MAC</text>
  <circle cx="388" cy="626" r="2.5" fill="#059669"/><text x="400" y="630" font-size="11" fill="#475569">hash_equals() in konstanter Zeit</text>
  <circle cx="388" cy="645" r="2.5" fill="#059669"/><text x="400" y="649" font-size="10.6" fill="#475569">32-Byte-Master-Key erzwungen</text>

  <rect x="684" y="536" width="276" height="140" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="704" y="566" font-size="13.5" font-weight="700" fill="#0F172A">Erweiterbarkeit — Algorithmus ergänzen</text>
  <circle cx="710" cy="588" r="2.5" fill="#D97706"/><text x="722" y="592" font-size="10.4" fill="#475569">1. Familien-Vertrag implementieren</text>
  <circle cx="710" cy="607" r="2.5" fill="#D97706"/><text x="722" y="611" font-size="9.7" fill="#475569">2. Eindeutigen Bezeichner liefern</text>
  <circle cx="710" cy="626" r="2.5" fill="#D97706"/><text x="722" y="630" font-size="10.6" fill="#475569">3. In der Registry registrieren</text>
  <circle cx="710" cy="645" r="2.5" fill="#D97706"/><text x="722" y="649" font-size="11" fill="#475569">4. Über jede Fassade auflösen</text>

  <text x="40" y="700" font-size="9.9" fill="#94A3B8">Jede Familie folgt demselben Aufbau: Ein neuer Algorithmus ist eine neue Klasse plus ein register()-Aufruf — der Anwendungscode hängt weiterhin nur von Interfaces ab.</text>
</svg>
