  <text x="60" y="278" font-size="8.5" fill="#475569">প্রতি ইনস্ট্যান্সে একটি কী, প্রতি কলে র্যান্ডম IV।</text>
  <text x="60" y="292" font-size="11" fill="#475569">বাইনারি পেলোড, AEAD বা encrypt-then-MAC</text>

  <!-- ══════ card 2 : asymmetric ══════ -->
  <rect x="362" y="96" width="276" height="200" rx="14" fill="#FFFFFF" stroke="#C4B5FD"/>
  <circle cx="392" cy="130" r="17" fill="#F5F3FF"/>
  <text x="392" y="136" font-size="15" font-weight="700" fill="#6D28D9" text-anchor="middle">A</text>
  <text x="420" y="126" font-size="14.5" font-weight="700" fill="#0F172A">অ্যাসিমেট্রিক এনক্রিপশন</text>
  <text x="420" y="144" font-size="10.5" fill="#64748B">AsymmetricCipherRegistry ·</text>
  <text x="420" y="157" font-size="10.5" fill="#64748B">AsymmetricCryptoManager</text>
  <line x1="382" y1="166" x2="618" y2="166" stroke="#E2E8F0"/>
  <rect x="382" y="176" width="40" height="23" rx="11" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="402" y="191.5" font-size="11" fill="#5B21B6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sm2</text>
  <text x="382" y="224" font-size="11" fill="#475569">প্রতিটি কলে কী-জোড়া পাঠাতে হয় —</text>
  <text x="382" y="238" font-size="10.3" fill="#475569">এনক্রিপ্টে পাবলিক কী, ডিক্রিপ্টে প্রাইভেট।</text>
  <text x="382" y="252" font-size="10.6" fill="#475569">কী ও সাইফারটেক্সট চলে hex স্ট্রিং হিসেবে।</text>
  <text x="382" y="278" font-size="10.5" fill="#B45309">ext-gmp দরকার (GMP বড় পূর্ণসংখ্যা)।</text>
  <text x="382" y="292" font-size="10.6" fill="#475569">Sm2EncryptionService দেয় স্ট্যাটিক ফ্যাসাড।</text>

  <!-- ══════ card 3 : hashing ══════ -->
  <rect x="684" y="96" width="276" height="200" rx="14" fill="#FFFFFF" stroke="#67E8F9"/>
