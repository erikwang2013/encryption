  </g>
  <g fill="#166534">
    <text x="220" y="448" font-size="12" font-weight="700">SymmetricCipherInterface</text>
    <text x="220" y="466" font-size="10.5">Alias: EncryptorInterface</text>
    <text x="402.5" y="448" font-size="12" font-weight="700">AsymmetricCipherInterface</text>
    <text x="616" y="448" font-size="12" font-weight="700">HasherInterface</text>
    <text x="616" y="466" font-size="10.5" fill="#15803D">digest() · digestHex()</text>
    <text x="814" y="444" font-size="11.5" font-weight="700">KeyDerivationInterface</text>
    <text x="814" y="462" font-size="11.5" font-weight="700">PasswordBasedKdfInterface</text>
  </g>
  <text x="402.5" y="466" font-size="8.5" fill="#15803D">Schlüsselmaterial pro Aufruf</text>
  <text x="814" y="478" font-size="9.6" fill="#15803D">IKM vs. Passwortstreckung</text>

  <!-- gap 4 -->
  <text x="589" y="514" font-size="9.7" fill="#64748B" text-anchor="middle">④ Implementierungen erfüllen den Vertrag — Algorithmen hinzufügen oder wechseln, ohne den Anwendungscode anzufassen</text>
  <line x1="292" y1="540" x2="292" y2="520" stroke="#34D399" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arwUp)"/>
  <line x1="490" y1="540" x2="490" y2="520" stroke="#34D399" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arwUp)"/>
  <line x1="688" y1="540" x2="688" y2="520" stroke="#34D399" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arwUp)"/>
  <line x1="886" y1="540" x2="886" y2="520" stroke="#34D399" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arwUp)"/>

  <!-- ═══ implementations ═══ -->
  <g font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" fill="#334155">
    <rect x="204" y="546" width="176" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="292" y="563.5">aes-256-gcm</text>
    <rect x="204" y="582" width="176" height="26" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="292" y="599.5">sodium-xchacha20</text>
