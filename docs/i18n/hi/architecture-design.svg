  <title id="archTitle">आर्किटेक्चर डिज़ाइन — erikwang2013/encryption</title>
  <desc id="archDesc">चार क्षमता परिवार (सममित, असममित, हैशिंग, कुंजी व्युत्पत्ति), जिनमें से प्रत्येक एक कॉन्ट्रैक्ट इंटरफ़ेस, एक रजिस्ट्री, एक फ़साड मैनेजर और एल्गोरिदम इम्पलीमेंटेशन से बना है, साथ ही मास्टर-कुंजी फ़ैक्टरी और क्रॉस-कटिंग इंटरनल।</desc>

