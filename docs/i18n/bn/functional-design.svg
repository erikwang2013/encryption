  <rect x="772" y="176" width="40" height="23" rx="11" fill="#ECFEFF" stroke="#67E8F9"/>
  <text x="792" y="191.5" font-size="11" fill="#155E75" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">sm3</text>
  <text x="704" y="224" font-size="9.8" fill="#475569">একমুখী ডাইজেস্ট, কী মেটেরিয়াল নেই,</text>
  <text x="704" y="238" font-size="10.9" fill="#475569">দুটি অ্যালগরিদমেই আউটপুট ৩২ বাইট।</text>
  <text x="704" y="252" font-size="10.6" fill="#475569">digest() দেয় বাইনারি, digestHex() টেক্সট।</text>
  <text x="704" y="278" font-size="9.6" fill="#475569">API সাইনিং ও ইন্টিগ্রিটি যাচাইয়ে ব্যবহৃত</text>
  <text x="704" y="292" font-size="11" fill="#475569">আর অভ্যন্তরে MAC কী তৈরি করতে।</text>

  <!-- ══════ card 4 : key derivation ══════ -->
  <rect x="40" y="316" width="276" height="200" rx="14" fill="#FFFFFF" stroke="#5EEAD4"/>
