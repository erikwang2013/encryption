  <text x="224" y="133" font-size="10.1" fill="#475569">Laravel · ThinkPHP · Hyperf · webman · খাঁটি PHP — কেবল কন্ট্রাক্ট ও ফ্যাসাডের উপর নির্ভর করে, নির্দিষ্ট কোনো অ্যালগরিদমের উপর নয়</text>

