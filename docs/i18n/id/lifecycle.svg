  <!-- ═══ maintenance & failures ═══ -->
  <text x="40" y="492" font-size="11" fill="#94A3B8" letter-spacing="1">PERAWATAN &amp; MODE KEGAGALAN</text>
  <rect x="40" y="504" width="440" height="112" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="60" y="532" font-size="13.5" font-weight="700" fill="#9A3412">Rotasi &amp; migrasi</text>
  <circle cx="66" cy="554" r="2.5" fill="#F59E0B"/><text x="78" y="558" font-size="11" fill="#7C2D12">Simpan identifier (dan prefiks v1) di tiap record</text>
  <circle cx="66" cy="573" r="2.5" fill="#F59E0B"/><text x="78" y="577" font-size="9.7" fill="#7C2D12">Dekripsi dengan kunci lama, enkripsi ulang dengan kunci baru</text>
  <circle cx="66" cy="592" r="2.5" fill="#F59E0B"/><text x="78" y="596" font-size="10.5" fill="#7C2D12">setDefaultIdentifier() mengganti default, kode pemanggil tak berubah</text>

  <rect x="520" y="504" width="440" height="112" rx="14" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="540" y="532" font-size="13.5" font-weight="700" fill="#991B1B">Kegagalan memicu EncryptionException</text>
  <circle cx="546" cy="554" r="2.5" fill="#EF4444"/><text x="558" y="558" font-size="8.6" fill="#7F1D1D">Prefiks tidak valid, ciphertext terlalu pendek</text>
  <circle cx="546" cy="573" r="2.5" fill="#EF4444"/><text x="558" y="577" font-size="9.6" fill="#7F1D1D">Tag atau MAC tidak cocok — data diubah atau kunci salah</text>
  <circle cx="546" cy="592" r="2.5" fill="#EF4444"/><text x="558" y="596" font-size="9.4" fill="#7F1D1D">Identifier tak dikenal, algoritma tak terdaftar, panjang kunci salah</text>

  <text x="40" y="644" font-size="10" fill="#94A3B8">Bootstrap terjadi sekali per proses (factory mendaftarkan semua encryptor sekaligus); enkripsi dan dekripsi adalah jalur kritis setiap permintaan.</text>
