  <title id="lifeTitle">Siklus hidup permintaan — erikwang2013/encryption</title>
  <desc id="lifeDesc">Siklus hidup nilai yang dilindungi: siapkan kunci utama 32 byte, turunkan subkunci per algoritma, daftarkan implementasi, enkripsi dengan IV acak, simpan blob berversi, lalu pilih, verifikasi, dan dekripsi; ditambah rotasi dan mode kegagalan.</desc>

  <defs>
    <marker id="lcArw" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="660" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#0F172A">Siklus hidup permintaan</text>
  <text x="40" y="72" font-size="13.9" fill="#64748B">Dari kunci utama ke plaintext dan kembali — bootstrap, jalur tulis enkripsi, jalur baca dekripsi, rotasi dan mode kegagalan</text>

  <text x="40" y="104" font-size="11" fill="#94A3B8" letter-spacing="1">JALUR TULIS</text>
  <text x="40" y="308" font-size="11" fill="#94A3B8" letter-spacing="1">JALUR BACA</text>

  <!-- ═══ write path ═══ -->
  <g>
    <rect x="40" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="66" cy="144" r="15" fill="#EEF2FF"/>
    <text x="66" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">1</text>
    <text x="90" y="149" font-size="14.5" font-weight="700" fill="#0F172A">Penyediaan</text>
    <line x1="60" y1="168" x2="225" y2="168" stroke="#E2E8F0"/>
    <text x="60" y="194" font-size="9.6" fill="#475569">Kunci 32 byte dari env atau KMS,</text>
    <text x="60" y="212" font-size="9.6" fill="#475569">bukan kata sandi mentah.</text>
    <text x="60" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">base64_decode($envKey)</text>
  </g>
  <line x1="245" y1="185" x2="272" y2="185" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="278" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="304" cy="144" r="15" fill="#EEF2FF"/>
    <text x="304" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">2</text>
    <text x="328" y="149" font-size="14.5" font-weight="700" fill="#0F172A">Derivasi</text>
    <line x1="298" y1="168" x2="463" y2="168" stroke="#E2E8F0"/>
    <text x="298" y="194" font-size="9.8" fill="#475569">Satu subkunci per algoritma,</text>
    <text x="298" y="212" font-size="8.9" fill="#475569">agar kunci tidak dipakai ulang.</text>
    <text x="298" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dgn:derive:aes-gcm</text>
  </g>
  <line x1="483" y1="185" x2="510" y2="185" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
